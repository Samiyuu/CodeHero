plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ccat.coderhero'
    compileSdk 34

    defaultConfig {
        applicationId "com.ccat.coderhero"
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName "1.1"
    }

    // Release signing: create keystore.properties next to settings.gradle (see README). Not committed to git.
    def ksFile = rootProject.file('keystore.properties')
    def ksProps = new Properties()
    if (ksFile.exists()) ksFile.withInputStream { ksProps.load(it) }

    signingConfigs {
        release {
            if (ksFile.exists()) {
                storeFile rootProject.file(ksProps['storeFile'])
                storePassword ksProps['storePassword']
                keyAlias ksProps['keyAlias']
                keyPassword ksProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (ksFile.exists()) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// ✅ Fix: Exclude conflicting old Kotlin stdlib modules
configurations {
    all {
        exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
        exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
}
